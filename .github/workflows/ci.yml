name: CI

on:
  push:
    branches: [main, fix/comprehensive-review]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Validate MVP
        run: node scripts/validate-mvp.mjs 2>&1 | tee /tmp/validate-mvp.log
      - name: Report validate failure
        if: failure()
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "/tmp/validate-mvp.log";
            if (!fs.existsSync(file)) process.exit(0);
            const lines = fs.readFileSync(file, "utf8").trim().split("\n");
            const message = lines.slice(-40).join(" | ").slice(0, 7000);
            const escaped = message.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            console.log(`::error title=validate-mvp::${escaped}`);
          '
      - name: Install Chromium
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee /tmp/playwright-install.log || {
            echo "::warning title=playwright-install::--with-deps failed; retrying browser install without OS packages"
            npx playwright install chromium 2>&1 | tee -a /tmp/playwright-install.log
          }
      - name: Report Playwright install failure
        if: failure()
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "/tmp/playwright-install.log";
            if (!fs.existsSync(file)) process.exit(0);
            const lines = fs.readFileSync(file, "utf8").trim().split("\n");
            const message = lines.slice(-40).join(" | ").slice(0, 7000);
            const escaped = message.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            console.log(`::error title=playwright-install::${escaped}`);
          '
      - name: Run Playwright tests
        run: npx playwright test 2>&1 | tee /tmp/playwright.log
      - name: Report Playwright test failure
        if: failure()
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "/tmp/playwright.log";
            if (!fs.existsSync(file)) process.exit(0);
            const lines = fs.readFileSync(file, "utf8").trim().split("\n");
            const message = lines.slice(-60).join(" | ").slice(0, 7000);
            const escaped = message.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            console.log(`::error title=playwright-tests::${escaped}`);
          '
      - run: npm audit --audit-level=high
